name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:vscode
      - run: npx prettier --check "src/**/*.{ts,css}" "tests/**/*.ts" "scripts/build.mjs" "scripts/*vscode*"
      - run: npm run test:coverage
      - run: npm run build && npm run build:firefox && npm run build:vscode
      - name: Lint Firefox package
        run: npx web-ext lint --source-dir dist/firefox --warnings-as-errors=false
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (real extension)
        run: npm run test:e2e
      - name: VS Code webview tests (fake host, real CSP)
        run: npm run test:vscode:webview
      - name: Package the VS Code extension (size budget, vsce checks)
        run: npm run package:vscode
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  vscode-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vscode: [1.90.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extension tests in VS Code ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:vscode
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
