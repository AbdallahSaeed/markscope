name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/PRIVACY.md', 'docs/store/screenshots/**', 'scripts/build-site.mjs', 'package.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build site
        run: node scripts/build-site.mjs
        env:
          # Set these repository variables once the store listings are live.
          CHROME_STORE_URL: ${{ vars.CHROME_STORE_URL }}
          FIREFOX_STORE_URL: ${{ vars.FIREFOX_STORE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
